name: Deploy to Surge

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Vite
        run: bun run build

      - name: Deploy to Surge
        # uses: mahmoudgalalz/surge-action@v0.1.5
        # with:
        #   domain: "github-profile-looker-trev7or23.surge.sh"
        #   path: "./dist"
        run: bunx surge ./dist github-profile-looker-trev7or23.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
